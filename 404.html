<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>404 | Page Not Found</title>

<link rel="stylesheet" href="style.css">

<style>

body{

    margin:0;

    display:flex;

    justify-content:center;

    align-items:center;

    height:100vh;

    background:#0f172a;

    color:white;

    font-family:Arial,sans-serif;

    text-align:center;

}

h1{

    font-size:110px;

    margin:0;

    color:#38BDF8;

}

p{

    color:#94A3B8;

    margin:20px 0;

}

a{

    display:inline-block;

    margin-top:20px;

    padding:14px 28px;

    border-radius:10px;

    background:#38BDF8;

    color:white;

    text-decoration:none;

}

</style>

</head>

<body>

<div>

<h1>404</h1>

<h2>Page Not Found</h2>

<p>
The page you're looking for doesn't exist.
</p>

<a href="/">
Go Back Home
</a>

</div>

</body>

</html>
